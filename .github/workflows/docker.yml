name: Container image

# Builds the image and checks that the server inside it starts and answers
# introspection, which is what a client or a directory does first.
on:
  push:
    branches: [main]
    paths: [Dockerfile, .dockerignore, package.json, package-lock.json, "src/**", .github/workflows/docker.yml]
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: docker build -t mdisbetter-mcp .

      - name: The server starts and lists its tools
        run: |
          set -euo pipefail
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | timeout 30 docker run -i --rm mdisbetter-mcp > out.txt || true
          cat out.txt | cut -c1-300
          grep -q '"name":"mdisbetter"' out.txt
          grep -q '"name":"convert_file"' out.txt
          grep -q '"name":"list_conversions"' out.txt
